function parseRich(s) {

}

// B 19.62–30.47 古人：陶工 / 木匠 / 乞丐 / 国王

  [B(31), '夜里一个人，又{讨厌自己}。'],
  [B(32), '可你想过没有——'],
  [B(33), '那个让你眼红的人，'],
  [B(34), '为什么偏偏在你[隔壁]？'],
  [B(35), '因为他走的那条路——'],
  [D2, ''],
  [B(37), '隔壁的人，不是你的敌人，'],
  [B(38), '是你看得见、也[够得着]的路。'],
  [B(39), ''],
  [B(41), ''],
];

window.draw = function (t) {
  const floorK = 1 - win(t, 30.2, B(15) + 0.1, 0.5);
  background(t, floorK);
  // 场景（两头交叉淡化）
  sceneA(t, 1 - ease((t - 16.3) / 0.15));
  sceneB(t, win(t, B(1) - 0.1, B(6) + 0.3, 0.4));
  const cShrink = ease((t - (B(10) - 0.4)) / 0.6);
  sceneC(t, win(t, B(6), B(10) + 0.2, 0.4), cShrink);
  sceneD(t, win(t, B(10) - 0.3, B(15) + 0.1, 0.4));
  sceneE(t, win(t, B(15) - 0.2, B(21) + 0.2, 0.4));
  sceneF(t, win(t, B(21) - 0.1, B(27) + 0.4, 0.5));
  sceneG(t, win(t, B(27), B(41) + 0.4, 0.6));
  endCard(t, ease((t - B(41)) / 0.8) * (1 - ease((t - (END - 1.2)) / 1.1)));
  // 左上框
  infoBox('2700 年前', '古希腊 · 赫西俄德', win(t, B(1) + 0.2, B(6) + 0.2, 0.4));
  infoBox('2009', '日本 · 脑扫描实验', win(t, B(10), B(15), 0.4));
  citation(win(t, B(10) + 0.3, B(15), 0.4), 'Takahashi et al. (2009). Science', '《你的收获，是我的痛》');
  // 两次大爆点前：画面收暗、静止；重拍那一帧闪亮
  for (const d of [D1, D2]) {
    if (t > d - 1.05 && t < d) { ctx.fillStyle = `rgba(6,5,7,${0.9 * ease((t - (d - 1.05)) / 0.85)})`; ctx.fillRect(0, 0, W, H); }
    if (t >= d && t < d + 1.0) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(255,220,160,${0.2 * Math.exp(-(t - d) * 8)})`; ctx.fillRect(0, 0, W, H); ctx.restore(); }
  }
  anchorWord(t, D1, '社会比较 · Social Comparison', 1 - ease((t - (B(1) - 0.35)) / 0.35));
  if (t >= D1 && t < B(1)) { // 第一次爆点：你和兄弟并排站在地上
    const k = ease((t - D1 - 0.3) / 0.5);
    figure(900, HORIZON, true, k, 0.7, 1); figure(1020, HORIZON, false, k, 0.7, 0.9);
    nameTag(900, '你', k, true); nameTag(1020, '兄弟', k);
  }
  anchorWord(t, D2, '你也走得到的地方', 1 - ease((t - (B(37) - 0.3)) / 0.4));
  cornerTag(t < END - 1.5 ? 1 : 0);
  // 字幕
  let cur = null;
  for (const s of SUBS) if (t >= s[0]) cur = s;
  if (cur && cur[1]) {
    const next = SUBS.find((s) => s[0] > cur[0]);
    const out = next ? 1 - ease((t - (next[0] - 0.12)) / 0.12) : 1;
    subtitle(cur[1], t - cur[0], cur[2], out);
  }
  vignette(ctx, 0.45);
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.35;
  ctx.drawImage(grains[Math.floor(t * 30) % grains.length], 0, 0, W, H); ctx.restore();
  if (t > END - 0.8) { ctx.fillStyle = `rgba(0,0,0,${ease((t - (END - 0.8)) / 0.8)})`; ctx.fillRect(0, 0, W, H); }
};

(async () => {
  const all = SUBS.map((s) => s[1]).join('') + '七宗罪嫉妒你兄弟同桌闺蜜前任首富身家+100亿考上编了我订婚啦最近过得挺好《工作与时日》Works and Days作者赫西俄德时间约公元前700年地点古希腊陶工木匠乞丐国王明星2700年前古希腊2009日本脑扫描实验Takahashi et al. (2009). Science《你的收获，是我的痛》疼爽同龄人：升职了被裁了我车被刮了，心疼死没事吧？|坏人？嫉妒越强，幸灾乐祸越强多考20分“我也想要。”你更怕兄弟过得苦，还是更怕兄弟开路虎？评论区说说E N V Y·THE SEVEN DEADLY SINS嫉妒你嫉妒的人，住在你隔壁；你想要的路，你也走得到。参考：赫西俄德《工作与时日》；Takahashi, H. et al. (2009). When Your Gain Is My Pain and Your Pain Is My Gain. Science 323: 937–939隔壁社会比较 · Social Comparison你也走得到的地方';
  await Promise.all(['400 30px "Noto Serif SC"', '600 30px "Noto Serif SC"', '700 30px "Noto Serif SC"', '900 30px "Noto Serif SC"']
    .map((f) => document.fonts.load(f, all)));
  await document.fonts.ready;
  ctx = setup();
  const r = rng(19);
  const pal = [['214,150,70', 0.22], ['214,150,70', 0.18], ['230,170,90', 0.14], ['70,90,150', 0.16], ['150,60,60', 0.12]];
  for (let i = 0; i < 24; i++) {
    const [c, a] = pal[Math.floor(r() * pal.length)];
    bokeh.push({ x: r() * W, y: r() * H * 0.95, r: 30 + r() * 80, c, a: a * (0.3 + r() * 0.4), sp: 0.1 + r() * 0.2, ph: r() * 6, dx: (r() - 0.5) * 6 });
  }
  for (let i = 0; i < 220; i++) motes.push({ x: r() * W, y: r() * H, v: 4 + r() * 10, a: 0.1 + r() * 0.35, s: 1 + r() * 1.6, ph: r() * 6 });
  for (let g = 0; g < 4; g++) {
    const c = document.createElement('canvas'); c.width = W / 2; c.height = H / 2;
    const gx = c.getContext('2d'), img = gx.createImageData(W / 2, H / 2), rr = rng(100 + g);
    for (let i = 0; i < img.data.length; i += 4) { const v = 128 + (rr() - 0.5) * 70; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
    gx.putImageData(img, 0, 0); grains.push(c);
  }
  draw(0);
  window.done = true;
})();
